services:
      kafka:
            image: confluentinc/cp-kafka:7.6.1
            environment:
                  KAFKA_NODE_ID: 1
                  KAFKA_PROCESS_ROLES: broker,controller
                  CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
                  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_CONTROLLER:PLAINTEXT
                  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_CONTROLLER://0.0.0.0:29094
                  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
                  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
                  KAFKA_CONTROLLER_LISTENER_NAMES: PLAINTEXT_CONTROLLER
                  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29094,2@kafka-2:29094,3@kafka-3:29094"
                  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
            ports:
                  - "9092:9092"
            volumes:
                  - kafka_data:/var/lib/kafka/data
            healthcheck:
                  test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
                  interval: 5s
                  timeout: 10s
                  retries: 5
      kafka-2:
            image: confluentinc/cp-kafka:7.6.1
            environment:
                  KAFKA_NODE_ID: 2
                  KAFKA_PROCESS_ROLES: broker,controller
                  CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
                  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_CONTROLLER:PLAINTEXT
                  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_CONTROLLER://0.0.0.0:29094
                  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9093,PLAINTEXT://kafka-2:29092
                  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
                  KAFKA_CONTROLLER_LISTENER_NAMES: PLAINTEXT_CONTROLLER
                  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29094,2@kafka-2:29094,3@kafka-3:29094"
                  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
            ports:
                  - "9093:9092"
            volumes:
                  - kafka2_data:/var/lib/kafka/data
            healthcheck:
                  test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
                  interval: 5s
                  timeout: 10s
                  retries: 5
      kafka-3:
            image: confluentinc/cp-kafka:7.6.1
            environment:
                  KAFKA_NODE_ID: 3
                  KAFKA_PROCESS_ROLES: broker,controller
                  CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
                  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_CONTROLLER:PLAINTEXT
                  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_CONTROLLER://0.0.0.0:29094
                  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9094,PLAINTEXT://kafka-3:29092
                  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
                  KAFKA_CONTROLLER_LISTENER_NAMES: PLAINTEXT_CONTROLLER
                  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29094,2@kafka-2:29094,3@kafka-3:29094"
                  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
            ports:
                  - "9094:9092"
            volumes:
                  - kafka3_data:/var/lib/kafka/data
            healthcheck:
                  test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
                  interval: 5s
                  timeout: 10s
                  retries: 5
      kafka-init:
            image: confluentinc/cp-kafka:7.6.1
            depends_on:
                  kafka:
                        condition: service_healthy
                  kafka-2:
                        condition: service_healthy
                  kafka-3:
                        condition: service_healthy
            entrypoint: ["/bin/sh", "-c"]
            command: >
                  "kafka-topics --create --if-not-exists --topic parkflow.events.raw --bootstrap-server kafka:29092 --partitions 3 --replication-factor 3 --config min.insync.replicas=2"
      postgres:
            image: postgres:16
            environment:
                  POSTGRES_DB: parkflow
                  POSTGRES_USER: parkflow_user
                  POSTGRES_PASSWORD: parkflow_password
            ports:
                  - "5432:5432"
            volumes:
                  - postgres_data:/var/lib/postgresql/data
                  - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
                  - ./database/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      spark:
            build:
                  context: .
                  dockerfile: DockerFile.spark
            user: root
            depends_on:
                  kafka:
                        condition: service_healthy
                  kafka-init:
                        condition: service_completed_successfully
                  postgres:
                        condition: service_started
            volumes:
                  - ./spark:/opt/spark-apps
                  - spark-ivy:/opt/ivy
            command: >
                  /opt/spark/bin/spark-submit
                  --conf spark.jars.ivy=/opt/ivy
                  --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0
                  /opt/spark-apps/streaming_job.py
volumes:
      postgres_data:
      kafka_data:
      kafka2_data:
      kafka3_data:
      spark-ivy: